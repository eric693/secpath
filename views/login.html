<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登入 {{LEVEL_TITLE}} · SecPath 資安學堂</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="plain">
  <header class="plain-head">
    <a class="brand" href="/"><span class="brand-name">SecPath</span><span class="brand-sub">資安學堂</span></a>
    <a class="plain-link" href="/">返回課程首頁</a>
  </header>
  <main class="login-wrap">
    <section class="login-card">
      <div class="overline">{{ORG}}</div>
      <h1>{{LEVEL_NAME}}課程登入</h1>
      <p class="muted">本課程僅限授權學員使用，請輸入{{LEVEL_NAME}}課程密碼。</p>
      {{ERROR}}
      <form method="post" action="/{{LEVEL}}/login">
        <label class="field"><span>課程密碼</span>
          <input class="input" type="password" name="password" required autofocus autocomplete="current-password" maxlength="200">
        </label>
        <button class="btn accent lg" type="submit" style="width:100%">進入課程</button>
      </form>
      <dl class="login-info">
        {{SUBJECTS}}
      </dl>
    </section>
  </main>
</body>
</html>
